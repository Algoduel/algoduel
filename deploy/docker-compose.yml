# Инфраструктура для разработки: docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: algoduel
      POSTGRES_PASSWORD: algoduel
      POSTGRES_DB: algoduel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:
